# CloudTwin configuration. Every key is optional; CLOUDTWIN_* environment
# variables override these values. See docs/developer-guide.md#configuration.
cloudtwin:
  api_port: 4793

  storage:
    path: /data/cloudtwin.db   # ":memory:" for ephemeral runs

  providers:
    aws:
      ses:
        strict_verification: true    # reject sends from unverified identities (MessageRejected), like SES
        verification:
          mode: auto                 # auto | manual | after_checks | delay
          outcome: SUCCESS           # SUCCESS | FAILED | TEMPORARY_FAILURE
        account:
          production_access_enabled: true   # false = SES sandbox
      s3:
        virtual_host_suffix: s3.localhost   # {bucket}.s3.localhost → path style
      cognito: {}                    # issuer_base_url, signing_key_path, *_token_ttl_seconds,
                                     # cors_allowed_origins (default: any origin)

    azure:
      blob:
        account_name: devstoreaccount1
      servicebus:
        namespace: cloudtwin

    gcp:
      project: cloudtwin-local

  mailbox:
    enabled: true
    smtp_port: 1025       # SMTP listener: capture inbox + SES receipt rules

  # Resources to create at startup and after POST /_cloudtwin/reset, e.g.:
  # seed:
  #   s3:  { buckets: [uploads] }
  #   sqs: { queues: [jobs] }

  bedrock:
    defaults:
      mode: text

    # Every entry in models: appears in ListFoundationModels.
    # name: and provider: are optional — both are derived from the model_id key if omitted.
    models:
      # ── Real foundation models ────────────────────────────────────────────
      amazon.titan-text-express-v1:
        name: Amazon Titan Text Express
        provider: amazon

      anthropic.claude-3-sonnet-20240229-v1:0:
        name: Claude 3 Sonnet
        provider: anthropic

      anthropic.claude-3-haiku-20240307-v1:0:
        name: Claude 3 Haiku
        provider: anthropic

      meta.llama3-70b-instruct-v1:0:
        name: Llama 3 70B Instruct
        provider: meta

      cohere.command-r-v1:0:
        name: Command R
        provider: cohere

      # ── Test / simulation stubs ───────────────────────────────────────────
      test.text:
        mode: text
        text: { min_words: 5, max_words: 15 }

      test.schema:
        mode: schema
        schema:
          type: object
          properties:
            answer: { type: string }
            score:  { type: number }
            tags:   { type: array, items: { type: string } }

      test.static:
        mode: static
        static: { result: fixed, value: 42 }

      test.sequence:
        sequence:
          mode: sequence
          responses:
            - static: { answer: first }
            - static: { answer: second }

      test.cycle:
        sequence:
          mode: cycle
          responses:
            - static: { answer: a }
            - static: { answer: b }

      test.rules:
        mode: text
        rules:
          - contains: sentiment
            response: { static: { sentiment: positive, score: 0.9 } }
          - contains: fail
            error: { type: ThrottlingException, message: Rule-triggered throttle }

      test.inject:
        mode: text
        errors:
          - every: 3
            type: ThrottlingException
            message: Every 3rd request fails

      test.stream:
        mode: text
        streaming:
          enabled: true
          chunk_mode: word
          chunk_delay_ms: 0
